    <script>
      /* 白屏兜底：把致命错误直接显在页面上（WebView 里看不到控制台，只能看屏） */
      (function () {
        function show(msg) {
          var el = document.getElementById("root");
          if (!el) return;
          el.innerHTML =
            '<pre style="color:#c0392b;font-size:12px;word-break:break-all;white-space:pre-wrap;padding:24px;line-height:1.6">' +
            String(msg).replace(/</g, "&lt;") + "</pre>";
        }
        window.addEventListener("error", function (e) {
          show((e.message || "error") + "\n@ " + (e.filename || "") + ":" + (e.lineno || 0));
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          show("unhandled: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-DtSKB7dk.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D17eQ2lv.css">
  </head>
  <body>
    <div id="root"></div>
  </body>

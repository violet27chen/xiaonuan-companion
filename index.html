<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陪诊小暖 · 老年人 AI 陪诊助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231b6c80'/%3E%3Cpath d='M14 32h8l4-10 6 20 5-14 3 4h10' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* framed-sheet 方向 · face: 低饱和暖石 frame + 医疗青蓝 accent */
  :root{
    --ground:#f2f1ef; --surface:#ffffff; --raised:#f9f9f7; --active:#ebebe8;
    --border:#e7e4dc; --rule:#eeece6;
    --text:#1c1a17; --muted:#6b675f;
    --accent:#1b6c80; --accent-deep:#15586a; --accent-wash:#eaf2f4;
    --warm:#f0a184; --warm-deep:#e8946f;
    --positive:#1e7a4f; --positive-wash:#e7f3ec;
    --negative:#c0392b; --negative-wash:#fbeeec;
    --warning:#92400e; --warning-wash:#fdf6e7;
    --radius-card:12px; --radius-ctl:10px; --radius-sheet:16px;
    --pad:16px; --gap:14px;
    --font:"IBM Plex Sans","PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--ground);color:var(--text);
    font-size:17px;line-height:1.6;display:grid;grid-template-rows:auto 1fr auto}
  body{overflow:hidden}
  main{min-height:0}
  button{font-family:inherit;cursor:pointer}
  svg{display:block}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- 顶栏（chrome） ---------- */
  header{display:flex;align-items:center;gap:12px;padding:10px 16px 8px;
    width:min(1000px,calc(100% - 16px));margin:0 auto}
  .mark{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .tt{flex:1;min-width:0}
  .tt h1{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
  .tt p{font-size:13px;color:var(--muted);margin-top:1px}
  .profile-btn{display:flex;align-items:center;gap:7px;height:44px;padding:0 14px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    font-size:15px;font-weight:500;color:var(--text)}
  .profile-btn:active{background:var(--active)}

  /* ---------- 语音视图（唯一视图） ---------- */
  #voiceView{display:flex;flex-direction:column;overflow:hidden}
  .stage{flex:none;display:flex;flex-direction:column;align-items:center;padding:18px 16px 4px}
  .ip-wrap{position:relative;width:min(260px,62vw);aspect-ratio:236/212;display:grid;place-items:center;
    scale:calc(1 + var(--amp,0)*.05)}
  .ring{position:absolute;width:83%;aspect-ratio:1;border:2px solid var(--accent);
    border-radius:50%;opacity:0;pointer-events:none}
  #voiceView.listen .ring{animation:rip 1.7s ease-out infinite}
  .ring.r2{animation-delay:.55s}.ring.r3{animation-delay:1.1s}
  @keyframes rip{0%{transform:scale(.86);opacity:.4}100%{transform:scale(1.45);opacity:0}}
  .ip{width:82%;position:relative;z-index:1;animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(5px)}}
  .eye,.eyes,.mouth-talk{transform-box:fill-box;transform-origin:center}
  .eyes{transition:transform .25s}
  .eye{animation:blink 4.6s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
  #voiceView.listen .eyes{transform:scale(1.15)}
  #voiceView.think .eyes{transform:translate(-4px,-4px)}
  #voiceView.think .bodyG{animation:sway 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  @keyframes sway{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
  .mouth-talk{display:none}
  #voiceView.speak .mouth-smile{display:none}
  #voiceView.speak .mouth-talk{display:block;animation:talk .34s ease-in-out infinite alternate}
  @keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  #voiceView.speak .bodyG{animation:bob .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes bob{to{transform:translateY(-4px)}}
  .status{font-size:18px;font-weight:500;text-align:center;min-height:1.6em;margin-top:8px}
  .status.dim{color:var(--muted);font-weight:400}
  .caps{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 18px 4px}
  .cwrap{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
  #capList{display:flex;flex-direction:column;gap:14px}
  .cap .cl{font-size:13px;color:var(--muted);margin-bottom:3px}
  .cap .ct{font-size:18px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .cap.bot-now .ct{background:var(--accent-wash);border-radius:12px;padding:9px 13px;display:inline-block}
  .caps .card{margin-left:0;max-width:100%}
  .pin{display:flex;align-items:center;justify-content:center;gap:7px;
    padding:10px 0 8px;color:var(--muted);font-size:13px}
  .pin svg{flex-shrink:0}

  /* ---------- 语音底部（大话筒 = 语音开关） ---------- */
  footer.voice{display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:14px 16px calc(12px + env(safe-area-inset-bottom))}
  .subtitle{width:100%;max-width:680px;min-height:3.2em;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:19px;font-weight:500;line-height:1.5;padding:0 6px}
  .subtitle:empty{min-height:0}
  .subtitle .sw{font-size:14px;color:var(--muted);margin-right:8px;flex-shrink:0}
  #bigMic{width:78px;height:78px;border-radius:999px;border:none;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #bigMic:active{background:var(--accent-deep)}
  #bigMic.rec{background:var(--negative);animation:pulse 1.1s infinite}
  #bigMic.off{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
  #bigMic.off:active{background:var(--active)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .hint{font-size:14px;color:var(--muted);text-align:center}
  .pause{border:none;background:none;color:var(--muted);font-size:13px;
    text-decoration:underline;text-underline-offset:3px;padding:2px 8px}
  .pause:active{color:var(--accent-deep)}
  .safety{font-size:12px;color:var(--muted);text-align:center}

  /* ---------- 结构化卡片 ---------- */
  .card{max-width:100%;border:1px solid var(--border);
    border-radius:var(--radius-card);overflow:hidden}
  .card-head{display:flex;align-items:baseline;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--rule)}
  .card-head .cht{font-size:17px;font-weight:600}
  .card-head .chs{font-size:13px;color:var(--muted);margin-left:auto}
  .card-body{padding:12px 16px 14px}
  .kv{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:16px}
  .kv:first-child{border-top:none}
  .kv .k{width:4.5em;flex-shrink:0;color:var(--muted)}
  .kv .v{flex:1;font-weight:500}
  .kv .v.big{font-size:19px;font-weight:600}
  ul.pts{list-style:none}
  ul.pts li{padding:7px 0 7px 16px;border-top:1px solid var(--rule);font-size:16px;position:relative}
  ul.pts li:first-child{border-top:none}
  ul.pts li::before{content:"";position:absolute;left:2px;top:16px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
  .alertline{background:var(--negative-wash);color:var(--negative);border-radius:var(--radius-ctl);
    padding:10px 14px;font-size:16px;font-weight:600;margin-top:10px}
  .med{border:1px solid var(--border);border-radius:var(--radius-ctl);padding:12px 14px;margin-top:10px}
  .med:first-child{margin-top:0}
  .med .mn{font-size:18px;font-weight:600}
  .med .md{font-size:15px;color:var(--muted);margin-top:3px}
  .med .mt{display:inline-block;margin-top:7px;background:var(--accent-wash);color:var(--accent-deep);
    border-radius:6px;padding:3px 10px;font-size:14px;font-weight:600}
  .warnbox{background:var(--warning-wash);border-radius:var(--radius-ctl);padding:10px 14px;margin-top:10px}
  .warnbox .wt{font-size:14px;font-weight:600;color:var(--warning);margin-bottom:2px}
  .warnbox li{list-style:none;font-size:15px;color:var(--warning);padding:3px 0}
  .fubox{background:var(--raised);border-radius:var(--radius-ctl);padding:12px 14px;margin-top:10px;font-size:15px}
  .fubox .ft{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}
  .fubox b{font-size:17px}
  .card-ops{display:flex;gap:10px;padding:0 16px 13px}
  .card-ops button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-ctl);
    font-size:15px;font-weight:500;color:var(--accent-deep)}
  .card-ops button:active{background:var(--accent-wash)}
  .card-ops button:disabled{color:var(--muted)}

  /* ---------- 档案抽屉 ---------- */
  #drawer{position:fixed;inset:0;background:rgba(28,26,23,.44);z-index:50;display:none}
  #drawer.open{display:block}
  .sheetp{position:absolute;left:0;right:0;bottom:0;background:var(--surface);
    border-radius:20px 20px 0 0;max-height:86vh;overflow-y:auto;
    padding:22px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheetp h2{font-size:20px;font-weight:600}
  .sheetp .tip{font-size:14px;color:var(--muted);margin:4px 0 16px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:14px;font-weight:500;margin-bottom:7px}
  .fld input,.fld textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-ctl);
    padding:12px 14px;font-size:17px;font-family:inherit;outline:none;background:var(--surface)}
  .fld textarea{height:74px;resize:none}
  .fld input:focus,.fld textarea:focus{border-color:var(--accent)}
  .sheet-ops{display:flex;gap:10px;margin-top:4px}
  .sheet-ops button{flex:1;height:48px;border-radius:var(--radius-ctl);border:none;
    font-size:16px;font-weight:600;background:var(--accent);color:#fff}
  .sheet-ops #closeP{background:var(--surface);border:1px solid var(--border);color:var(--text)}

  /* ---------- 启动模态框（加载中 / 点我开始） ---------- */
  #boot{position:fixed;inset:0;background:var(--ground);z-index:100;
    display:flex;align-items:center;justify-content:center;transition:opacity .25s}
  #boot.hide{opacity:0;pointer-events:none}
  .boot-card{display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:36px 46px;background:var(--surface);border:1px solid var(--border);
    border-radius:20px;box-shadow:0 10px 30px rgba(28,26,23,.08);text-align:center;max-width:86vw}
  .boot-face{animation:breathe 3.4s ease-in-out infinite}
  #boot .bt{font-size:21px;font-weight:600;margin-top:10px;line-height:1.4}
  #boot .bs{font-size:15px;color:var(--muted);line-height:1.5}
  .boot-retry{margin-top:14px;height:46px;padding:0 28px;border:none;border-radius:999px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:600;font-family:inherit}
  .boot-retry:active{background:var(--accent-deep)}

  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:99;
    background:var(--text);color:var(--surface);font-size:15px;border-radius:999px;
    padding:10px 20px;display:none;max-width:86vw;text-align:center}
</style>
</head>
<body>

<header>
  <div class="mark" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 3-8 1.5 2H21"/></svg>
  </div>
  <div class="tt">
    <h1>陪诊小暖</h1>
    <p>诊前帮您说清，诊后帮您记住</p>
  </div>
  <button class="profile-btn" onclick="openDrawer()" aria-label="打开健康档案">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1z"/><rect x="5" y="6" width="14" height="15" rx="2"/><path d="M9 12h6M9 16h6"/></svg>
    健康档案
  </button>
</header>

<!-- ============ 语音视图（唯一） ============ -->
<main id="voiceView">
  <div class="stage">
    <div class="ip-wrap" id="ipWrap">
      <span class="ring" aria-hidden="true"></span>
      <span class="ring r2" aria-hidden="true"></span>
      <span class="ring r3" aria-hidden="true"></span>
      <svg class="ip" viewBox="0 0 220 208" aria-label="小暖">
        <g class="bodyG">
          <path d="M112 54 C102 36 132 30 127 47 C125 55 114 54 113 49" fill="none" stroke="#5a4f44" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="110" cy="124" rx="70" ry="64" fill="#fffdfa" stroke="#e6dccd" stroke-width="3"/>
          <circle cx="62" cy="124" r="10" fill="#f7c6b8" opacity=".8"/>
          <circle cx="158" cy="124" r="10" fill="#f7c6b8" opacity=".8"/>
          <g class="eyes">
            <g class="eye"><circle cx="86" cy="108" r="7" fill="#4a4038"/></g>
            <g class="eye"><circle cx="134" cy="108" r="7" fill="#4a4038"/></g>
          </g>
          <path class="mouth-smile" d="M96 130 Q110 142 124 130" fill="none" stroke="#4a4038" stroke-width="4" stroke-linecap="round"/>
          <ellipse class="mouth-talk" cx="110" cy="135" rx="10" ry="9" fill="#7a4a42"/>
          <path d="M66 148 C66 176 92 187 110 187 C128 187 154 176 154 148" fill="none" stroke="#1b6c80" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="110" cy="186" r="9" fill="#fff" stroke="#1b6c80" stroke-width="3"/>
        </g>
      </svg>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="caps" id="capScrollBox">
    <div class="cwrap">
      <div id="capList"></div>
      <div class="pin" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        对话和健康档案只保存在这台手机里，不会上传云端
      </div>
    </div>
  </div>
</main>

<!-- ============ 语音底部：字幕 + 大话筒 + 暂停 ============ -->
<footer class="voice" id="vFoot">
  <div class="subtitle" id="subtitle" aria-live="polite"></div>
  <button id="bigMic" class="off" onclick="bigMic()" aria-label="开始说话或发送">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <div class="hint" id="hint">点一下话筒，我就一直听您说</div>
  <button class="pause" id="pauseBtn" onclick="pauseVoice()">暂停语音</button>
  <div class="safety">小暖只帮您整理和提醒，不做诊断、不推荐药物；紧急情况请拨打 120</div>
</footer>

<div id="drawer" role="dialog" aria-label="健康档案">
  <div class="sheetp">
    <h2>健康档案</h2>
    <div class="tip">只存在您自己的手机里，不会上传云端。填写后小暖每次都会记得。</div>
    <div class="fld"><label for="p_name">怎么称呼</label><input id="p_name" placeholder="如：王阿姨"></div>
    <div class="fld"><label for="p_age">年龄和性别</label><input id="p_age" placeholder="如：72岁 女"></div>
    <div class="fld"><label for="p_hist">既往病史（手术、慢性病等）</label><textarea id="p_hist" placeholder="如：2021年心脏支架；高血压10年"></textarea></div>
    <div class="fld"><label for="p_med">现在每天吃的药</label><textarea id="p_med" placeholder="如：阿司匹林每天1片；降压药早1粒"></textarea></div>
    <div class="fld"><label for="p_alg">药物过敏</label><textarea id="p_alg" placeholder="如：青霉素过敏"></textarea></div>
    <div class="fld"><label for="p_exam">近期检查</label><textarea id="p_exam" placeholder="如：2025年8月心电图"></textarea></div>
    <div class="sheet-ops"><button id="saveP" onclick="saveProfile()">保存</button><button id="closeP" onclick="closeDrawer()">关闭</button></div>
  </div>
</div>

<div id="toast" role="status"></div>

<!-- ============ 启动模态框：只有加载慢/失败时才出现 ============ -->
<div id="boot" role="dialog" aria-modal="true" aria-label="正在准备" style="display:none">
  <div class="boot-card">
    <div class="boot-face">
      <svg viewBox="0 0 64 64" width="76" height="76" aria-hidden="true">
        <ellipse cx="32" cy="34" rx="24" ry="22" fill="#fffdfa" stroke="#e6dccd" stroke-width="2.5"/>
        <circle cx="24" cy="30" r="2.8" fill="#4a4038"/>
        <circle cx="40" cy="30" r="2.8" fill="#4a4038"/>
        <path d="M26 38 Q32 43 38 38" stroke="#4a4038" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M36 18 C33 13 42 12 40 17" fill="none" stroke="#5a4f44" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="bt" id="bootT">正在准备…</div>
    <div class="bs" id="bootS">小暖马上就来</div>
    <button class="boot-retry" id="bootRetry" hidden onclick="location.reload()">再试一次</button>
  </div>
</div>

<script>
/* ================= 基础状态 ================= */
const API = "/companion";
let cid = localStorage.getItem("xn_cid") || (()=>{ const v="c-"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("xn_cid",v); return v; })();
let caps = {asr:false, tts:false};
let profile = JSON.parse(localStorage.getItem("xn_profile")||"{}");
let busy = false, voiceOn = false;          // voiceOn：语音会话总开关（话筒点按切换）
const ICON = {
  spk:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg>',
  copy:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
};

/* ================= 档案 ================= */
function profileText(){
  const p=[];
  if(profile.name) p.push("称呼："+profile.name);
  if(profile.age) p.push("年龄性别："+profile.age);
  if(profile.hist) p.push("既往病史："+profile.hist);
  if(profile.med) p.push("在服药物："+profile.med);
  if(profile.alg) p.push("药物过敏："+profile.alg);
  if(profile.exam) p.push("近期检查："+profile.exam);
  return p;
}
function openDrawer(){
  p_name.value=profile.name||""; p_age.value=profile.age||""; p_hist.value=profile.hist||"";
  p_med.value=profile.med||""; p_alg.value=profile.alg||""; p_exam.value=profile.exam||"";
  drawer.classList.add("open");
}
function closeDrawer(){ drawer.classList.remove("open"); }
function saveProfile(){
  profile={name:p_name.value.trim(),age:p_age.value.trim(),hist:p_hist.value.trim(),med:p_med.value.trim(),alg:p_alg.value.trim(),exam:p_exam.value.trim()};
  localStorage.setItem("xn_profile",JSON.stringify(profile));
  closeDrawer(); toast("档案已保存（只存在本机）");
}

/* ================= 状态机 ================= */
const voiceView=document.getElementById("voiceView"), statusEl=document.getElementById("status");
const pauseBtn=document.getElementById("pauseBtn");
const STATUS={
  idle:"语音关了 · 点一下话筒再开始",
  listen:"在听您说…（说完了点一下话筒）",
  think:"小暖在想…",
  speak:"小暖在说… 点话筒停"
};
function setVS(s, txt){

/* ================= WAV 录音 + VAD 静音断句 ================= */
let recCtx=null, recProc=null, recSrc=null, recStream=null, recBuf=[], recTimer=null, recStarting=false, micRetry=0;
let speechSeen=false, silenceMs=0, lastAmp=0, recFrames=0, recWatch=null;
const MIC_MAX_RETRY=3;
async function startRec(){
  if(recCtx || recStarting) return;
  recStarting=true;
  let stream=null;
  try{
    // 约束用 ideal：个别机型/WebView 不支持回声消除或降噪，硬约束会直接拒绝录音
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      channelCount:{ideal:1}, echoCancellation:{ideal:true}, noiseSuppression:{ideal:true}, autoGainControl:{ideal:true}
    }});
  }catch(e){
    // APK 里可能赶上系统权限弹窗还没批：等一会重试，别直接放弃
    recStarting=false;
    if(voiceOn && micRetry<MIC_MAX_RETRY){
      micRetry++;
      setVS("idle","麦克风正在准备，请稍等…");
      setTimeout(()=>{ if(voiceOn && !recCtx && !recStarting) startRec(); },1600);
      return;
    }
    voiceOn=false; setMicUI(); setSubtitle("","");
    setVS("idle","麦克风没打开，点一下话筒再试");
    toast("麦克风没打开，允许权限后再点一下话筒");
    return;
  }
  micRetry=0;
  if(!voiceOn){ stream.getTracks().forEach(t=>t.stop()); recStarting=false; return; }   // 等权限回来时用户已关掉
  try{
    recCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(recCtx.state==="suspended"){ recCtx.resume().catch(()=>{}); }
    recStream=stream; unlockTries=0;
    recBuf=[]; recFrames=0; speechSeen=false; silenceMs=0;
    recSrc=recCtx.createMediaStreamSource(stream);
    recProc=recCtx.createScriptProcessor(4096,1,1);
    recProc.onaudioprocess=e=>{
      const d=e.inputBuffer.getChannelData(0);
      recFrames++;
      recBuf.push(new Float32Array(d));
      let sum=0; for(let i=0;i<d.length;i++) sum+=d[i]*d[i];
      const rms=Math.sqrt(sum/d.length);
      const now=performance.now();
      if(now-lastAmp>90){ lastAmp=now; document.getElementById("ipWrap").style.setProperty("--amp",Math.min(1,rms*7).toFixed(2)); }
      if(rms>0.016){ speechSeen=true; silenceMs=0; }
      else if(speechSeen){ silenceMs+=(4096/recCtx.sampleRate)*1000; if(silenceMs>1500) stopRec(); }
    };
    recSrc.connect(recProc); recProc.connect(recCtx.destination);
    setMicUI();
    if(recCtx.state==="suspended"){
      // 浏览器/WebView 还没拿到用户手势：等第一次点屏幕再真正收音
      setVS("listen","点一下屏幕，我就开始听");
      document.getElementById("hint").textContent="点一下屏幕就开始了";
      toast("点一下屏幕，小暖就开始听");
    }else{
      setVS("listen");
      armRecTimer(); armFrameWatch();
    }
  }catch(e){
    try{ recProc&&recProc.disconnect(); recSrc&&recSrc.disconnect(); }catch(_){}
    stream.getTracks().forEach(t=>t.stop());
    if(recCtx){ recCtx.close().catch(()=>{}); }
    recCtx=null; recProc=null; recSrc=null;
    setVS("idle","麦克风出了点问题，点一下话筒再试");
  }finally{ recStarting=false; }
}
function armRecTimer(){ clearTimeout(recTimer); recTimer=setTimeout(()=>stopRec(false),60000); }
/* 音频通道自检：4 秒还没收到任何声音帧，就提示或自动重听一次 */
function armFrameWatch(){
  clearTimeout(recWatch);
  recWatch=setTimeout(()=>{
    if(!recCtx || recFrames>0) return;
    if(recCtx.state==="suspended"){
      // 浏览器/WebView 还没拿到用户手势：别关麦克风，等第一次点屏幕解锁（unlockAudio 会重新计时）
      setVS("listen","点一下屏幕，我就开始听");
      document.getElementById("hint").textContent="点一下屏幕就开始了";
      toast("点一下屏幕，小暖就开始听");
      return;
    }
    stopRec(true);
    if(voiceOn){ setVS("idle","没收到声音，小暖再听一次"); setTimeout(()=>{ if(voiceOn && !recCtx && !recStarting) startRec(); },800); }
  },4000);
}
function stopRec(silent){
  if(!recCtx) return;
  clearTimeout(recTimer); clearTimeout(recWatch);
  const rate=recCtx.sampleRate, chunks=recBuf;
  try{ recProc.disconnect(); recSrc.disconnect(); }catch(e){}
  if(recStream) recStream.getTracks().forEach(t=>t.stop());
  recCtx.close(); recCtx=null; recProc=null; recSrc=null; recStream=null; recBuf=[];
  setMicUI();
  document.getElementById("ipWrap").style.setProperty("--amp",0);
  if(silent) return;
  const total=chunks.reduce((n,c)=>n+c.length,0);
  if(total<rate*0.7 || !speechSeen){ setVS("idle","还没听到您说话，您再说"); if(voiceOn) scheduleListen(); return; }
  const pcm=new Float32Array(total); let off=0;
  chunks.forEach(c=>{ pcm.set(c,off); off+=c.length; });
  const blob=encodeWav(pcm,rate);
  setVS("think");
  blobToB64(blob).then(b64=>streamSend({audio:b64, mime:"audio/wav"}));
}

/* ================= 大话筒：说完了发送 / 打断 / 开关 ================= */
let abortCtl=null, paused=false, replayGuardAt=0, unlockTries=0;
function bigMic(){
  if(Date.now()-replayGuardAt<900) return;                   // 这一下刚用来补播语音了，不当切换
  if(recCtx){
    if(recCtx.state==="suspended"){ unlockAudio(); return; } // 还没解锁：这一下只用来开始收音
    stopRec(false);                                          // 说完了 -> 把录到的内容发给小暖
    return;
  }
  if(busy || curAudio){                                      // 小暖在说/在想 -> 打断，然后听您说
    interruptSpeak();
    if(abortCtl) abortCtl.abort();
    setVS("idle","您说，我听着");
    if(voiceOn) scheduleListen();
    return;
  }
  if(paused){ paused=false; pauseBtn.textContent="暂停语音"; }
  if(voiceOn){ turnVoiceOff(); return; }                     // 空闲 -> 关掉语音
  voiceOn=true; setMicUI(); startRec();                      // 关 -> 开始听
}
/* 暂停语音 / 继续语音：停下来不发送，也不说话 */
function pauseVoice(){
  if(!paused){
    paused=true; voiceOn=false;
    if(abortCtl) abortCtl.abort();
    stopRec(true);
    interruptSpeak();
    clearTimeout(hfTimer);
    blockedText="";
    setSubtitle("","");
    pauseBtn.textContent="继续语音";
    setMicUI();
    setVS("idle","已暂停 · 点“继续语音”接着聊");
  }else{
    paused=false; voiceOn=true;
    pauseBtn.textContent="暂停语音";
    setMicUI();
    startRec();
  }
}
/* 关掉语音（大话筒空闲时点一下） */
function turnVoiceOff(){
  voiceOn=false; paused=false;
  pauseBtn.textContent="暂停语音";
  if(abortCtl) abortCtl.abort();
  stopRec(true);
  interruptSpeak();
  clearTimeout(hfTimer);
  blockedText="";
  setSubtitle("","");
  setMicUI();
  setVS("idle");
}
/* 浏览器要过用户手势才让 AudioContext 收音：点一下屏幕解锁 */
function unlockAudio(){
  if(!recCtx || recCtx.state!=="suspended") return;
  unlockTries++; const tries=unlockTries;
  recCtx.resume().then(()=>{
    if(!recCtx) return;
    if(recCtx.state!=="running"){ if(tries>=3) failMic("麦克风启动不了，请再点一下话筒"); return; }
    recBuf=[]; recFrames=0; speechSeen=false; silenceMs=0;
    setVS("listen"); setMicUI(); armRecTimer(); armFrameWatch();
  }).catch(()=>{ if(tries>=3) failMic("麦克风启动不了，请再点一下话筒"); });
}
/* 麦克风实在起不来：降级成可再次点开的普通状态，别把老人卡死 */
function failMic(msg){
  stopRec(true);
  voiceOn=false; paused=false;
  pauseBtn.textContent="暂停语音";
  setSubtitle("","");
  setMicUI();
  setVS("idle",msg);
  toast(msg);
}

/* ================= 逐句 TTS 播报（预取 + 可打断） ================= */
let interrupted=false, curAudio=null, hfTimer=null, blockedText="";
const ttsMemo={};
function splitSent(t){
  return t.replace(/\s+/g," ").replace(/([。！？!?；;])/g,"$1\u0001").split("\u0001").map(s=>s.trim()).filter(Boolean);
}
function ttsFor(s){
  return ttsMemo[s]||(ttsMemo[s]=(async()=>{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","makers-conversation-id":cid},body:JSON.stringify({action:"tts",text:s})});
    if(!r.ok) throw new Error("tts");
    const j=await r.json(); if(!j.audio) throw new Error("tts");
    return j.audio;
  })());
}
function interruptSpeak(){ interrupted=true; if(curAudio){ curAudio.pause(); curAudio=null; } }
function scheduleListen(){
  clearTimeout(hfTimer);
  hfTimer=setTimeout(()=>{ if(voiceOn && !recCtx && !busy && !recStarting) startRec(); }, 900);
}
async function speakReply(text){
  if(!caps.tts){ if(text) capBot(text); setSubtitle("小暖",text); setVS("idle"); if(voiceOn) scheduleListen(); return; }
  const sents=splitSent(text);
  if(!sents.length){ setVS("idle"); setSubtitle("",""); if(voiceOn) scheduleListen(); return; }
  interrupted=false; setVS("speak");
  for(let i=0;i<sents.length;i++){
    if(interrupted) return;
    let b64;
    try{ const p=ttsFor(sents[i]); if(sents[i+1]) ttsFor(sents[i+1]); b64=await p; }
    catch(e){ capBot(sents.slice(i).join("")); break; }
    if(interrupted) return;
    capBot(sents[i], true);
    setSubtitle("小暖", sents[i]);
    const done=await new Promise(res=>{ curAudio=new Audio("data:audio/wav;base64,"+b64);
      curAudio.onended=()=>res(true); curAudio.onerror=()=>res(false);
      curAudio.play().catch(()=>res("blocked")); });
    curAudio=null;
    if(done==="blocked"){   // 浏览器要求先点一下屏幕才让出声：先看字幕，点屏后补播
      setSubtitle("小暖", text);
      blockedText=text;
      setVS("idle","点一下屏幕，我就能开口说话");
      if(voiceOn) scheduleListen();
      return;
    }
  }
  if(!interrupted){ setVS("idle"); setSubtitle("",""); if(voiceOn) scheduleListen(); }
}

/* ================= 请求管道（语音唯一） ================= */
async function streamSend(extra){
  if(busy) return; busy=true;
  const ctl=new AbortController(); abortCtl=ctl;
  const reply={text:""};
  let aborted=false;
  setVS("think");
  try{
    const resp=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","makers-conversation-id":cid},signal:ctl.signal,
      body:JSON.stringify(Object.assign({profile:profileText()},extra))});
    if(!resp.ok){
      const e=await resp.json().catch(()=>({}));
      capBot(e.error||("请求失败（"+resp.status+"）"));
    }else{
      const reader=resp.body.getReader(); const dec=new TextDecoder(); let bufS="";
      while(true){
        const {done,value}=await reader.read(); if(done) break;
        bufS+=dec.decode(value,{stream:true});
        const parts=bufS.split("\n\n"); bufS=parts.pop();
        for(const p of parts){
          const line=p.split("\n").find(l=>l.startsWith("data:")); if(!line) continue;
          const dataStr=line.slice(5).trim(); if(dataStr==="[DONE]") continue;
          let ev; try{ ev=JSON.parse(dataStr); }catch(e){ continue; }
          if(ev.type==="asr"){ capUser(ev.content); setSubtitle("您", ev.content); }
          else if(ev.type==="ai_response") reply.text+=ev.content;
          else if(ev.type==="card") renderCard(ev.data);
          else if(ev.type==="error_message"){ capBot(ev.content); setSubtitle("", ev.content); }
        }
      }
    }
  }catch(e){
    if(e && e.name==="AbortError") aborted=true;
    else { capBot("网络出了点问题，请再试一次"); setSubtitle("", "网络出了点问题，请再试一次"); }
  }finally{
    if(abortCtl===ctl) abortCtl=null;
    busy=false;
  }
  if(aborted) return;                       // 用户主动关掉语音，安静退出
  if(reply.text) await speakReply(reply.text);
  else { setVS("idle","刚才没连上，您再说一遍试试"); if(voiceOn) scheduleListen(); }
}

/* ================= 点屏幕：解锁收音 / 补播被拦的语音 ================= */
document.addEventListener("pointerdown", ()=>{
  if(recCtx && recCtx.state==="suspended") unlockAudio();
  if(blockedText){ const t=blockedText; blockedText=""; replayGuardAt=Date.now(); speakReply(t); }
},{capture:true});
/* 排障用：控制台输入 __xn.state() 看麦克风实时状态 */
window.__xn={state:()=>({voiceOn, paused, busy, recording:!!recCtx, ctxState:recCtx?recCtx.state:"-", frames:recFrames,
  bufferedSec:recBuf.reduce((n,c)=>n+c.length,0)/(recCtx?recCtx.sampleRate:1)})};

/* ================= 启动：加载中模态框（只有慢/失败才出现） -> 就绪直接进聊天 ================= */
const boot=document.getElementById("boot"), bootT=document.getElementById("bootT"), bootS=document.getElementById("bootS"), bootRetry=document.getElementById("bootRetry");

(async ()=>{

  // caps 探测，失败自动重试；加载好了就直接进聊天，不用点任何按钮
  for(let i=0;i<80;i++){

      if(r.ok){ caps=await r.json(); if(caps.asr) break; }
    }catch(e){}
    if(i>1){ bootT.textContent="网络有点慢，还在试…"; bootS.textContent="请稍等一下，马上好"; }
    await new Promise(s=>setTimeout(s,2000));
  }
  if(caps.asr) startVoiceSession();
  else{
    boot.style.display="flex";
    bootT.textContent="语音服务暂时连不上";
    bootS.textContent="检查一下网络，然后再试一次";
    bootRetry.hidden=false;
  }
})();
</script>
</body>
</html>

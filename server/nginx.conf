# 兜底 server：拦截一切“非 ai.27c.site”的请求（含直连源站 IP），防止绕过 CDN 直接访问源站
# EdgeOne 回源时 Host 固定为 ai.27c.site；浏览器/扫描器直连 http://<源站IP> 时 Host 是 IP，会落到这里被拒
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444 = 收到请求头后直接断开连接，不返回任何响应体（比 403 更安全，不暴露源站存在）
    return 444;
}

# 业务 server：仅当 Host 为 ai.27c.site（即 EdgeOne 回源所用 Host）才提供服务
server {
    listen 80;
    listen [::]:80;
    server_name ai.27c.site;
    root /var/www/xiaonuan;
    index index.html;
    client_max_body_size 8m;

    location /api/realtime {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 豆包语音「音频生成 HTTP」代理（系统单向播报走这里，不占用实时全双工会话）
    location /tts {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location /companion {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html 不能被 CDN 缓存，否则发版后用户仍加载旧的 JS
    # private 头可让部分 CDN 直接放弃缓存；no-store 兜底
    location / {
        add_header Cache-Control "private, no-store, max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

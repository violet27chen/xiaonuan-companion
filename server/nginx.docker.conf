# Docker 版 Nginx：托管前端构建产物，并反代后端与语音中继。
# 用 server_name _ 通配，使 localhost 与任意域名都能访问（便于本地/迁移即开即用）。
# 生产若经 EdgeOne CDN 且需“禁止直连源站”，可在最前面加一块 server_name _ 返回 444 的兜底块。
server {
    listen 80 default_server;
    server_name _;

    root /var/www/xiaonuan;
    index index.html;
    client_max_body_size 8m;

    location /api/realtime {
        proxy_pass http://relay:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 豆包语音「音频生成 HTTP」代理（系统单向播报走这里，不占用实时全双工会话）
    location /tts {
        proxy_pass http://relay:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location /companion {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html 不缓存，发版后立即生效
    location / {
        add_header Cache-Control "private, no-store, max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

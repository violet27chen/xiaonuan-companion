name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: 陪诊小暖 APK v${{ github.run_number }}
          body: 小暖 Android 原生应用 APK v1.4。登录后可使用原生文字/语音聊天、语音控制拍照与字幕/语速、医嘱拍照识别、健康记录编辑与单项清除、用药提醒。下载 app-release.apk 安装即可；与已安装的同签名正式版可直接覆盖升级。首次安装需允许安装未知来源应用。
          files: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaonuan-apk
          path: android/app/build/outputs/apk/release/app-release.apk

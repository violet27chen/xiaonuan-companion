plugins {
    id 'com.android.application'
}

// release 签名：CI 经环境变量注入（keystore 由 GitHub secrets 解码传入）；本地构建导出同名变量即可用
def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def ksAlias = System.getenv("ANDROID_KEY_ALIAS")
def ksKeyPass = System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace 'com.xiaonuan.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaonuan.companion"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    signingConfigs {
        if (ksPath != null) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
